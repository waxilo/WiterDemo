name: Deploy Web to Cloudflare Pages

# Auto-deploy the web build on pushes to main that touch the frontend.
on:
  push:
    branches: [main]
    paths:
      - "front-end/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        working-directory: front-end
        run: npm ci

      - name: Build
        working-directory: front-end
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: front-end
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret; hardcoded so the deploy
          # doesn't depend on token-based account auto-discovery.
          CLOUDFLARE_ACCOUNT_ID: "33d023f61ebac424923f7285f9b142f8"
        run: npx --yes wrangler@4 pages deploy dist --project-name=writer-demo-web --branch=main
